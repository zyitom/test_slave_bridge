# RMCS EtherCAT bridge board: HPM6E80IVM1 on hpm6e00evk-equivalent hardware.
# The board is electrically the HPM6E00EVK reference design; this repo-owned
# board definition trims the BSP down to what the bridge firmware uses and
# adds the rmcs_board bootloader hooks (see board.h).
board:
    soc: HPM6E80
    device: HPM6E80xVMx
    openocd-soc: hpm6e80-dual-core
    openocd-probe: ft2232
    on-board-flash:
      type: qspi-nor-flash
      size: 16M
