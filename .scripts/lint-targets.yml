exclude:
  - bsp
  - build
  # Generated by the ecat core1 build (embedded core1 image array).
  - sec_core_img.c
  # Beckhoff-SSC-generated sources (license-gated, not in the repository).
  - SSC
  # host/src/transport/igh/reference/: standalone programs kept as proof of the
  # ecrt call sequences, compiled by hand against the IgH master headers. CMake
  # already drops them (host/CMakeLists.txt: FILTER ... EXCLUDE REGEX
  # "/transport/igh/reference/"), so linting them checked code the build never
  # produces -- 238 of the 594 clang-tidy findings came from here, including
  # every cert-err33-c. Only one directory in the tree carries this name.
  - reference

host:
  cmake: host/CMakeLists.txt
  folders:
    - core/src
    - core/include
    - host/src
    - host/include

rmcs_board:
  cmake: firmware/rmcs_board/CMakeLists.txt
  folders:
    - core/src
    - core/include
    - firmware/rmcs_board/app/src
    - firmware/rmcs_board/app/include
    - firmware/rmcs_board/bootloader/src
    - firmware/rmcs_board/bootloader/include

# EtherCAT stream bridge (dual-core superbuild). The compile database only
# exists after building the ecat superbuild locally; CI currently skips the
# clang-tidy pass for this target (missing database => warning, not failure)
# but does enforce clang-format on these folders.
rmcs_ecat:
  cmake: firmware/rmcs_board/ecat/CMakeLists.txt
  folders:
    - firmware/rmcs_board/boards/hpm6e80ivm1
    - firmware/rmcs_board/ecat/common
    - firmware/rmcs_board/ecat/core0/src
    - firmware/rmcs_board/ecat/core0/ssc_overrides
    - firmware/rmcs_board/ecat/core1/src

c_board:
  cmake: firmware/c_board/CMakeLists.txt
  folders:
    - core/src
    - core/include
    - firmware/c_board/app/src
    - firmware/c_board/app/include
    - firmware/c_board/bootloader/src
    - firmware/c_board/bootloader/include
